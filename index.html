<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Girlfriend's Day ❤️</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff8fb1,#ffd6e7);
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.card{
    text-align:center;
    background:white;
    padding:35px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
}

h1{
    color:#ff3b7d;
}

button{
    padding:12px 30px;
    margin:15px;
    border:none;
    border-radius:30px;
    font-size:18px;
    cursor:pointer;
    transition:.2s;
}

#yes{
    background:#ff4d88;
    color:white;
}

#no{
    background:#ddd;
    position:absolute;
}

#msg{
    font-size:22px;
    color:#ff3b7d;
    margin-top:20px;
    font-weight:bold;
}
</style>

</head>

<body>

<div class="card">
<h1>Happy Girlfriend's Day ❤️</h1>

<p>
Out of all the people in this world,<br>
I'd still choose you every single time.
</p>

<h2>Do you know how much I love you?</h2>

<button id="yes">Yes ❤️</button>
<button id="no">No 🙈</button>

<div id="msg"></div>

</div>

<script>

const no=document.getElementById("no");
const yes=document.getElementById("yes");
const msg=document.getElementById("msg");

function move(){

const x=Math.random()*(window.innerWidth-120);
const y=Math.random()*(window.innerHeight-70);

no.style.left=x+"px";
no.style.top=y+"px";

}

no.addEventListener("mouseover",move);
no.addEventListener("click",move);

yes.onclick=()=>{

document.body.innerHTML=`

<div style="height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
background:#ff8fb1;
color:white;
font-family:Arial;
text-align:center;
padding:20px;">

<h1 style="font-size:55px;">❤️</h1>

<h1>I love you so much.</h1>

<h2>Thank you for making every day brighter.</h2>

<p style="font-size:22px;">
Happy Girlfriend's Day, my favorite person.<br><br>

No matter what happens,<br>
I'll always be grateful that our paths crossed. 🌹
</p>

<h1>Forever Us 💖</h1>

</div>

`;

}

</script>

</body>
</html>
